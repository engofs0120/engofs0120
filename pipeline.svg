<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Career pipeline of Ömer Faruk Şahin</title>
  <desc id="d">A horizontal data pipeline where each node is a career stage, from HR data analyst in 2016 to Senior Data Analyst at RND in 2025. Data packets flow along the line toward a pulsing final node: Data Engineer.</desc>
  <style>
    text { font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; fill: #EAF1F3; }
    .name { font-size: 28px; font-weight: 700; letter-spacing: -0.4px; }
    .sub  { font-size: 14px; fill: #8FB0BD; }
    .yr   { font-size: 12px; font-weight: 700; fill: #8FB0BD; }
    .role { font-size: 12px; }
    .now  { fill: #F5B942; font-weight: 700; }
    .line { stroke: #3C6072; stroke-width: 3; fill: none; }
    .tail { stroke: #F5B942; stroke-width: 3; fill: none; stroke-dasharray: 6 8; animation: march 1.2s linear infinite; }
    .pulse { fill: none; stroke: #F5B942; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes march { to { stroke-dashoffset: -14; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .tail, .pulse, .cursor { animation: none; } }
  </style>

  <rect width="900" height="300" rx="14" fill="#0E2A35"/>

  <text x="40" y="62" class="name">Ömer Faruk Şahin</text>
  <text x="40" y="88" class="sub">Senior Data Analyst, building toward Data Engineering</text>

  <!-- pipeline -->
  <path class="line" d="M70 170 H705"/>
  <path class="tail" d="M705 170 H832"/>

  <!-- packets -->
  <g fill="#F5B942">
    <circle r="4" cy="0"><animateMotion dur="10s" begin="0s" repeatCount="indefinite" path="M70,170 H832"/><animate attributeName="opacity" dur="10s" begin="0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.94;1"/></circle>
    <circle r="4" cy="0"><animateMotion dur="10s" begin="2s" repeatCount="indefinite" path="M70,170 H832"/><animate attributeName="opacity" dur="10s" begin="2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.94;1"/></circle>
    <circle r="4" cy="0"><animateMotion dur="10s" begin="4s" repeatCount="indefinite" path="M70,170 H832"/><animate attributeName="opacity" dur="10s" begin="4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.94;1"/></circle>
    <circle r="4" cy="0"><animateMotion dur="10s" begin="6s" repeatCount="indefinite" path="M70,170 H832"/><animate attributeName="opacity" dur="10s" begin="6s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.94;1"/></circle>
    <circle r="4" cy="0"><animateMotion dur="10s" begin="8s" repeatCount="indefinite" path="M70,170 H832"/><animate attributeName="opacity" dur="10s" begin="8s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.94;1"/></circle>
  </g>

  <!-- past stages -->
  <g fill="#3C6072" stroke="#8FB0BD" stroke-width="3">
    <circle cx="70"  cy="170" r="9"/>
    <circle cx="197" cy="170" r="9"/>
    <circle cx="324" cy="170" r="9"/>
    <circle cx="451" cy="170" r="9"/>
    <circle cx="578" cy="170" r="9"/>
  </g>
  <!-- current stage -->
  <circle cx="705" cy="170" r="11" fill="#F5B942" stroke="#0E2A35" stroke-width="3"/>
  <!-- target stage -->
  <circle class="pulse" cx="832" cy="170" r="13"/>
  <circle cx="832" cy="170" r="13" fill="#0E2A35" stroke="#F5B942" stroke-width="3" stroke-dasharray="5 4"/>

  <!-- years -->
  <g text-anchor="middle">
    <text x="70"  y="142" class="yr">2016</text>
    <text x="197" y="142" class="yr">2017</text>
    <text x="324" y="142" class="yr">2019</text>
    <text x="451" y="142" class="yr">2021</text>
    <text x="578" y="142" class="yr">2023</text>
    <text x="705" y="142" class="yr now">2025</text>
    <text x="832" y="142" class="yr now">Next</text>

    <!-- roles -->
    <text x="70"  y="208" class="role">HR Data</text>
    <text x="70"  y="224" class="role">Analyst</text>

    <text x="197" y="208" class="role">Founder,</text>
    <text x="197" y="224" class="role">E-commerce</text>

    <text x="324" y="208" class="role">Reporting &amp;</text>
    <text x="324" y="224" class="role">Data Analyst</text>

    <text x="451" y="208" class="role">Senior Analyst,</text>
    <text x="451" y="224" class="role">Koton</text>

    <text x="578" y="208" class="role">Freelance &amp;</text>
    <text x="578" y="224" class="role">KVK, Sr. Analyst</text>

    <text x="705" y="208" class="role">Senior Analyst,</text>
    <text x="705" y="224" class="role">RND, Owl KPI</text>

    <text x="832" y="208" class="role now">Data Engineer</text>
    <text x="832" y="224" class="role sub">building<tspan class="cursor">_</tspan></text>
  </g>

  <text x="40" y="272" class="sub">Turning raw e-commerce data into decisions. Next: building the pipelines underneath.</text>
</svg>
